# tinyproxy.conf

User  nobody
Group nobody

Port     8888
Timeout  600
LogLevel Info

# Listen everywhere since Docker IPs can be dynamic
Listen 0.0.0.0

# Only allow connections from within the Docker network
# To find network name: docker network ls
# To find subnet: docker network inspect <network_name> | grep Subnet
Allow 172.16.0.0/12
# This is actually a wider range than shown, which is more reliable with Docker.

# We also need to allow localhost for the healthcheck and debugging
Allow 127.0.0.1

# Block everything by default
FilterDefaultDeny Yes

# Our whitelist of allowed domains
Filter "/etc/tinyproxy/filter.txt"

# Use extended regex in filter rules
FilterType ere