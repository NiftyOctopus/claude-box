services:
  claude:
    build:
      # Build Context: "Make all these files available when building the image"
      context: .  # Use current directory as build context
      dockerfile: Dockerfile
    
    container_name: claude-${PROJECT_SLUG:?Set PROJECT_SLUG in .env}
    networks:
      - internal # Force Claude to go through the proxy
    
    environment:
      HTTP_PROXY:  http://proxy:8888
      HTTPS_PROXY: http://proxy:8888
      NO_PROXY:    localhost,127.0.0.1

    volumes:
      # Mount local workspace directory (notes, files, etc)
      # Doesn't have to be in this directory
      # Claude will have read and write access to anything here
      - ${WORKSPACE_PATH:?Set WORKSPACE_PATH in .env}:/home/ubuntu/workspace
      
      # Read only access to a codebase
      - ${REPO_PATH:?Set REPO_PATH in .env}:/home/ubuntu/code:ro

      # Read only access to skills
      # Project specific skills are in WORKSPACE_PATH/.claude/skills
      - ${SKILLS_PATH:?Set SKILLS_PATH in .env}:/home/ubuntu/.claude/skills:ro

      # Named volume (managed by Docker) to persist auth, settings, etc
      - claude-config-${PROJECT_SLUG:?Set PROJECT_SLUG in .env}:/home/ubuntu/.claude
    
    # Jumps into workspace when you enter container (for convenience)
    working_dir: /home/ubuntu/workspace
    
    # Keep container running after start
    command: tail -f /dev/null
  
  proxy: # Simple forward proxy using tinyproxy
    build:
      context:  ./proxy
      dockerfile: Dockerfile
    
    container_name: proxy-${PROJECT_SLUG:?Set PROJECT_SLUG in .env}
    networks:
      - internal # For Claude
      - egress   # Internet access
    
    volumes:
      # Mount proxy filter.txt file so we can edit if needed
      # Read only access from inside container
      - ${PROXY_FILTER_PATH:?Set PROXY_FILTER_PATH in .env}:/etc/tinyproxy/filter.txt:ro
    
    restart: unless-stopped

volumes:
  # Named volume (managed by Docker) to persist auth, settings, etc
  claude-config-${PROJECT_SLUG:?Set PROJECT_SLUG in .env}:

networks:
  # Local with no internet access
  # Allows Claude to use the proxy
  internal:
    name: internal-${PROJECT_SLUG:?Set PROJECT_SLUG in .env}
    internal: true
  
  # Internet access
  # Only the proxy should have access
  egress:
    name: egress-${PROJECT_SLUG:?Set PROJECT_SLUG in .env}
